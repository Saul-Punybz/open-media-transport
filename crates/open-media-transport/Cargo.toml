[package]
name = "open-media-transport"
version = "0.1.0"
description = "Pure-Rust implementation of the Open Media Transport (OMT) protocol"
readme = "README.md"
# Fuzz targets need nightly; tests use captured data kept in the repository only.
exclude = ["fuzz/", "tests/"]
keywords = ["video", "omt", "broadcast", "streaming", "network"]
categories = ["multimedia::video", "network-programming"]
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mdns-sd = { version = "0.21", default-features = false }
# Already used by mdns-sd; `select` lets one browse wait on mDNS and a discovery server.
flume = { version = "0.12", default-features = false, features = ["select"] }
roxmltree = "0.21"
hostname = "0.4"
socket2 = "0.6"
vmx-codec = { path = "../vmx-codec", version = "0.1" }
